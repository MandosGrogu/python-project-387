name: opencode_issue
on:
  issues:
    types: [opened]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure Git Author and Credentials
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode/longcat-2.5-preview-free
          prompt: |
            Ты — нативный AI-агент OpenCode, интегрированный в GitHub. 
            Внимательно изучи текст последнего комментария пользователя.
            
            Если пользователь написал команду `/oc fix` или `/opencode fix`:
            Используй свои встроенные инструменты автоматизации репозитория. Авторизуйся в API, используя предоставленный GITHUB_TOKEN/GIT_AUTH_TOKEN с правами на запись. Тебе необходимо самостоятельно отправить (push) созданную локально ветку с префиксом `opencode/` в удаленный репозиторий и отправить POST-запрос на создание Pull Request, связав его с текущим Issue.
          mentions: "/opencode, /oc"
