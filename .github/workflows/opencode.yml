name: opencode
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode/longcat-2.5-preview-free
          prompt: |
            Ты — AI-разработчик. Проанализируй контекст текущего Issue/Пул-реквеста и текст комментария.
            
            Если комментарий содержит команду `/oc fix` или `/opencode fix`:
            1. Создай новую локальную ветку. Имя ветки должно иметь префикс `opencode/` (например, `opencode/fix-issue-${{ github.event.issue.number }}`).
            2. Напиши код, исправляющий описанную в Issue проблему. Внеси изменения в соответствующие файлы проекта.
            3. Сделай коммит и отправь (push) созданную ветку в удаленный репозиторий.
            4. Создай Pull Request из этой ветки в основную ветку репозитория.
            5. В описании Pull Request обязательно добавь ссылку на исходный Issue (используй ключевое слово для автозакрытия, например: "Closes #\${{ github.event.issue.number }}").
            
            Если команда `fix` отсутствует, просто ответь на комментарий обычным аналитическим текстом.
          mentions: |
            /opencode
            /oc
