name: opencode
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Git author
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode/longcat-2.5-preview-free
          prompt: |
            Ты — нативный AI-агент OpenCode, интегрированный в GitHub. 
            Внимательно изучи текст последнего комментария пользователя.
            
            Если пользователь написал команду `/oc fix` или `/opencode fix`:
            Используй свои встроенные инструменты автоматизации репозитория. Тебе необходимо самостоятельно создать новую ветку с префиксом `opencode/`, внести исправления в код проекта для решения описанной проблемы, сделать коммит от имени настроенного Git-автора и автоматически открыть Pull Request, связав его с текущим Issue.
          mentions: "/opencode, /oc"
