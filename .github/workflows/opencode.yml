name: opencode
on:
  issue:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode/longcat-2.5-preview-free
          prompt: |
            Ты — эксперт по триажу и управлению проектами. Проанализируй только что созданный Issue:
            1. **Суть проблемы**: Кратко опиши, в чем заключается баг или запрос.
            2. **Категория**: Определи тип (например: Bug, Feature Request, Documentation, Refactoring).
            3. **Критичность**: Оцени приоритет (Low, Medium, High, Critical) на основе описания.
            4. **План действий**: Предложи первые 2-3 шага для разработчика, чтобы воспроизвести или решить эту задачу.
            
            Ответь четко, используя Markdown-разметку.
          mentions: |
            /opencode
            /oc
